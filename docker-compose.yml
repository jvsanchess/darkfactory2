services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: darkfactory
      POSTGRES_USER: darkfactory
      POSTGRES_PASSWORD: darkfactory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkfactory -d darkfactory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DARKFACTORY_ENVIRONMENT: development
      DARKFACTORY_DATABASE_URL: postgresql+psycopg://darkfactory:darkfactory@postgres:5432/darkfactory
      DARKFACTORY_REDIS_URL: redis://redis:6379/0
      DARKFACTORY_QUEUE_ENABLED: "true"
      DARKFACTORY_AUTO_CREATE_SCHEMA: "false"
      DARKFACTORY_SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      DARKFACTORY_ENVIRONMENT: development
      DARKFACTORY_DATABASE_URL: postgresql+psycopg://darkfactory:darkfactory@postgres:5432/darkfactory
      DARKFACTORY_REDIS_URL: redis://redis:6379/0
      DARKFACTORY_QUEUE_ENABLED: "true"
      DARKFACTORY_AUTO_CREATE_SCHEMA: "false"
      DARKFACTORY_SEED_DEMO_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
